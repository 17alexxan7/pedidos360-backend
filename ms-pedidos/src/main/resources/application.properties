spring.application.name=pedidos360-backend

spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/0e309e18-e3ab-4256-8fcf-5608cfe52cbe/v2.0
spring.security.oauth2.resourceserver.jwt.audiences[0]=c96eeade-7cad-46b0-979f-ca4e30aa8889
spring.security.oauth2.resourceserver.jwt.audiences[1]=api://c96eeade-7cad-46b0-979f-ca4e30aa8889


# ---- Mensajeria RabbitMQ: nombres centralizados (app.messaging.*) ----
app.messaging.exchanges.direct=pedidos.direct
app.messaging.exchanges.topic=pedidos.topic
app.messaging.exchanges.dlx=pedidos.dlx

# Notificaciones: topic, pedido.creado -> cola.notificaciones
app.messaging.notificaciones.queue=cola.notificaciones
app.messaging.notificaciones.dlq=cola.notificaciones.dlq
app.messaging.notificaciones.routing-key=pedido.creado.#
app.messaging.notificaciones.dlq-routing-key=notificaciones.dead

# Tickets: direct, pedido.ticket -> cola.tickets
app.messaging.tickets.queue=cola.tickets
app.messaging.tickets.dlq=cola.tickets.dlq
app.messaging.tickets.routing-key=pedido.ticket
app.messaging.tickets.dlq-routing-key=tickets.dead

# Documentos: direct, pedido.documento -> cola.documentos
app.messaging.documentos.queue=cola.documentos
app.messaging.documentos.dlq=cola.documentos.dlq
app.messaging.documentos.routing-key=pedido.documento
app.messaging.documentos.dlq-routing-key=documentos.dead

# ---- Conexion RabbitMQ ----
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASS:admin123}

# ---- Publicacion de eventos ----
app.messaging.events.pedido-creado=pedido.creado
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
